name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Render
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Trigger API deploy
        env:
          RENDER_API_DEPLOY_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
        run: curl --fail --silent --show-error -X POST "$RENDER_API_DEPLOY_HOOK"

      - name: Trigger frontend deploy
        env:
          RENDER_WEB_DEPLOY_HOOK: ${{ secrets.RENDER_WEB_DEPLOY_HOOK }}
        run: curl --fail --silent --show-error -X POST "$RENDER_WEB_DEPLOY_HOOK"

      - name: Verify health
        if: vars.HEALTH_URL != ''
        run: curl --fail --retry 12 --retry-delay 5 "${{ vars.HEALTH_URL }}"
